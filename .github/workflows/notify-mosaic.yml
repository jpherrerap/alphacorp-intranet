# Avisa a mosAIc para que mueva su submódulo testbeds/alphacorp-intranet a este commit.
# Requiere el secreto MOSAIC_DISPATCH_TOKEN: token fine-grained con Contents read/write
# sobre platanus-hack/platanus-hack-26-cl-team-24.
name: Avisa a mosAIc

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: gh api repos/platanus-hack/platanus-hack-26-cl-team-24/dispatches -f event_type=intranet-updated
        env:
          GH_TOKEN: ${{ secrets.MOSAIC_DISPATCH_TOKEN }}
